<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Ladda ner Topicos från App Store eller Google Play.">
  <title>Ladda ner Topicos</title>

  <!-- Länken i appens SMS-inbjudan (topicos.app/download). Mobiler skickas direkt
       till rätt appbutik; datorer och okända enheter ser båda knapparna. -->
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Topicos">
  <meta property="og:url" content="https://topicos.app/download">
  <meta property="og:title" content="Ladda ner Topicos">
  <meta property="og:description" content="Chatt, uppgifter, kalender, dokument och samtal för teamet — strukturerat per ämne.">
  <meta property="og:image" content="https://topicos.app/Bilder/Topicos-showcase-2.png">

  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="logo.png">

  <script>
    // Körs i <head> så att mobilen hoppar vidare innan sidan hinner ritas.
    (function () {
      var ua = navigator.userAgent || navigator.vendor || '';
      var isAndroid = /android/i.test(ua);
      var isIOS = /iPad|iPhone|iPod/.test(ua) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      if (isIOS) {
        location.replace('https://apps.apple.com/se/app/topicos/id6757752536');
      } else if (isAndroid) {
        location.replace('https://play.google.com/store/apps/details?id=com.chattis.ShaboGo');
      }
    })();
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .download-page {
      flex: 1;
      align-self: stretch;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 3rem 16px 4rem;
    }
    .download-logo {
      width: 72px;
      height: 72px;
      border-radius: 18px;
      margin-bottom: 1.25rem;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    .download-page p {
      max-width: 28rem;
      margin: -1rem auto 2rem;
      opacity: 0.9;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <main class="cta-band download-page">
    <img src="logo.png" alt="Topicos" class="download-logo">
    <h2 data-i18n="title">Ladda ner Topicos</h2>
    <p data-i18n="lead">Installera appen och logga in med ditt telefonnummer för att gå med i gruppen du blivit inbjuden till.</p>
    <div class="app-badges">
      <a href="https://apps.apple.com/se/app/topicos/id6757752536" class="app-badge" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
        App Store
      </a>
      <a href="https://play.google.com/store/apps/details?id=com.chattis.ShaboGo" class="app-badge" rel="noopener">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M3.18 23.49c.22.17.49.26.78.26.19 0 .38-.05.56-.14l8.74-4.86-3.3-3.3L3.18 23.49zM.47 2.2C.17 2.6 0 3.15 0 3.8v16.4c0 .65.17 1.2.47 1.6l.04.04 9.2-9.2v-.08L.51 2.16.47 2.2zM20.17 10.13l-3.42-1.94-3.63 3.63 3.63 3.63 3.43-1.94c.98-.55 .98-1.45 0-2l-.01.01v-.01l-.01.01v-.01l.01.01v.01zM13.07 8.44L16.5 6.5 4.89.84c-.35-.2-.72-.27-1.06-.22l9.24 7.82z"/></svg>
        Google Play
      </a>
    </div>
  </main>

  <script>
    // SMS-inbjudan skickas på avsändarens språk, men mottagaren kan läsa ett annat.
    (function () {
      var texts = {
        en: {
          title: 'Download Topicos',
          lead: 'Install the app and sign in with your phone number to join the group you were invited to.'
        },
        es: {
          title: 'Descarga Topicos',
          lead: 'Instala la app e inicia sesión con tu número de teléfono para unirte al grupo al que te invitaron.'
        }
      };
      var lang = (navigator.language || 'sv').slice(0, 2).toLowerCase();
      var t = texts[lang];
      if (!t) return;
      document.documentElement.lang = lang;
      document.title = t.title;
      document.querySelectorAll('[data-i18n]').forEach(function (el) {
        el.textContent = t[el.getAttribute('data-i18n')];
      });
    })();
  </script>
</body>
</html>
